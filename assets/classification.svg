<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" role="img">
  <rect width="1100" height="820" fill="#f8fafc"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/><stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity=".16"/></filter>
  </defs>
  <style>.t{font-family:Segoe UI,Arial,sans-serif;text-anchor:middle}.l{stroke:#94a3b8;stroke-width:2;fill:none}</style>
  <text x="550" y="38" class="t" font-size="22" font-weight="800" fill="#0f172a">Классификация насосов по принципу действия</text>
  <text x="550" y="60" class="t" font-size="13" fill="#64748b">учебная схема для печати · дисциплина «Насосы и компрессоры»</text>

  <rect x="400" y="80" width="300" height="54" rx="14" fill="url(#g1)" filter="url(#sh)"/>
  <text x="550" y="114" class="t" font-size="20" font-weight="800" fill="#042f2e">НАСОСЫ</text>

  <path class="l" d="M550 134 V168"/>
  <path class="l" d="M275 168 H825"/>
  <path class="l" d="M275 168 V198"/>
  <path class="l" d="M825 168 V198"/>

  <!-- left: dynamic -->
  <rect x="140" y="198" width="270" height="48" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#sh)"/>
  <text x="275" y="228" class="t" font-size="16" font-weight="700" fill="#0c4a6e">Динамические</text>
  <text x="275" y="268" class="t" font-size="12" fill="#0369a1">кинетическая энергия потока</text>

  <path class="l" d="M275 278 V305"/>
  <path class="l" d="M70 305 H480"/>
  <path class="l" d="M70 305 V332 M172 305 V332 M275 305 V332 M378 305 V332 M480 305 V332"/>

  <!-- dynamic children -->
  <g id="dyn">
    <rect x="10" y="332" width="120" height="88" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/>
    <text x="70" y="365" class="t" font-size="13" font-weight="700">Центробежный</text>
    <text x="70" y="385" class="t" font-size="11" fill="#64748b">радиальное</text>
    <text x="70" y="402" class="t" font-size="11" fill="#64748b">колесо</text>

    <rect x="112" y="332" width="120" height="88" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/>
    <text x="172" y="365" class="t" font-size="13" font-weight="700">Осевой</text>
    <text x="172" y="385" class="t" font-size="11" fill="#64748b">пропеллер</text>
    <text x="172" y="402" class="t" font-size="11" fill="#64748b">большой Q</text>

    <rect x="215" y="332" width="120" height="88" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/>
    <text x="275" y="365" class="t" font-size="13" font-weight="700">Вихревой</text>
    <text x="275" y="385" class="t" font-size="11" fill="#64748b">периферийный</text>
    <text x="275" y="402" class="t" font-size="11" fill="#64748b">высокий H</text>

    <rect x="318" y="332" width="120" height="88" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/>
    <text x="378" y="365" class="t" font-size="13" font-weight="700">Струйный</text>
    <text x="378" y="385" class="t" font-size="11" fill="#64748b">эжектор</text>
    <text x="378" y="402" class="t" font-size="11" fill="#64748b">без движ. частей</text>

    <rect x="420" y="332" width="120" height="88" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/>
    <text x="480" y="365" class="t" font-size="13" font-weight="700">Диагональный</text>
    <text x="480" y="385" class="t" font-size="11" fill="#64748b">смешанный</text>
    <text x="480" y="402" class="t" font-size="11" fill="#64748b">поток</text>
  </g>

  <!-- right: volume -->
  <rect x="690" y="198" width="270" height="48" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#sh)"/>
  <text x="825" y="228" class="t" font-size="16" font-weight="700" fill="#92400e">Объёмные</text>
  <text x="825" y="268" class="t" font-size="12" fill="#b45309">вытеснение фиксированного объёма</text>

  <path class="l" d="M825 278 V305"/>
  <path class="l" d="M620 305 H1030"/>
  <path class="l" d="M620 305 V332 M722 305 V332 M825 305 V332 M928 305 V332 M1030 305 V332"/>

  <g id="vol">
    <rect x="560" y="332" width="120" height="88" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/>
    <text x="620" y="365" class="t" font-size="13" font-weight="700">Поршневой</text>
    <text x="620" y="385" class="t" font-size="11" fill="#64748b">возвратно-</text>
    <text x="620" y="402" class="t" font-size="11" fill="#64748b">поступательный</text>

    <rect x="662" y="332" width="120" height="88" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/>
    <text x="722" y="365" class="t" font-size="13" font-weight="700">Шестерённый</text>
    <text x="722" y="385" class="t" font-size="11" fill="#64748b">шестерни</text>
    <text x="722" y="402" class="t" font-size="11" fill="#64748b">масло / нефть</text>

    <rect x="765" y="332" width="120" height="88" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/>
    <text x="825" y="365" class="t" font-size="13" font-weight="700">Винтовой</text>
    <text x="825" y="385" class="t" font-size="11" fill="#64748b">шнеки</text>
    <text x="825" y="402" class="t" font-size="11" fill="#64748b">вязкие среды</text>

    <rect x="868" y="332" width="120" height="88" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/>
    <text x="928" y="365" class="t" font-size="13" font-weight="700">Пластинчатый</text>
    <text x="928" y="385" class="t" font-size="11" fill="#64748b">шиберный</text>
    <text x="928" y="402" class="t" font-size="11" fill="#64748b">гидросистемы</text>

    <rect x="970" y="332" width="120" height="88" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/>
    <text x="1030" y="365" class="t" font-size="13" font-weight="700">Мембранный</text>
    <text x="1030" y="385" class="t" font-size="11" fill="#64748b">диафрагма</text>
    <text x="1030" y="402" class="t" font-size="11" fill="#64748b">химия / дозация</text>
  </g>

  <!-- bottom comparison -->
  <rect x="40" y="460" width="1020" height="320" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="550" y="495" class="t" font-size="16" font-weight="700" fill="#0f172a">Сравнение классов (шпаргалка)</text>

  <text x="180" y="535" class="t" font-size="14" font-weight="700" fill="#0284c7">Динамические</text>
  <text x="180" y="560" class="t" font-size="12" fill="#334155">• Q зависит от H (кривая Q–H)</text>
  <text x="180" y="580" class="t" font-size="12" fill="#334155">• не создают жёсткий «запирающий» напор</text>
  <text x="180" y="600" class="t" font-size="12" fill="#334155">• чувствительны к вязкости и NPSH</text>
  <text x="180" y="620" class="t" font-size="12" fill="#334155">• типично: вода, НПЗ, теплосети</text>
  <text x="180" y="640" class="t" font-size="12" fill="#334155">• пуск при открытой задвижке на нагнетании</text>

  <text x="550" y="535" class="t" font-size="14" font-weight="700" fill="#0f172a">Критерий выбора</text>
  <text x="550" y="560" class="t" font-size="12" fill="#334155">нужен большой расход → динамический</text>
  <text x="550" y="580" class="t" font-size="12" fill="#334155">нужен высокий перепад / точная доза → объёмный</text>
  <text x="550" y="600" class="t" font-size="12" fill="#334155">вязкая нефть / масло → шестерённый / винтовой</text>
  <text x="550" y="620" class="t" font-size="12" fill="#334155">агрессивная химия → мембранный</text>
  <text x="550" y="640" class="t" font-size="12" fill="#334155">очень большой Q при малом H → осевой</text>

  <text x="900" y="535" class="t" font-size="14" font-weight="700" fill="#d97706">Объёмные</text>
  <text x="900" y="560" class="t" font-size="12" fill="#334155">• Q почти пропорционален частоте n</text>
  <text x="900" y="580" class="t" font-size="12" fill="#334155">• могут поднять давление до предела прочности</text>
  <text x="900" y="600" class="t" font-size="12" fill="#334155">• нужен предохранительный клапан</text>
  <text x="900" y="620" class="t" font-size="12" fill="#334155">• типично: масло, дозирование, гидравлика</text>
  <text x="900" y="640" class="t" font-size="12" fill="#334155">• нельзя полностью перекрывать нагнетание</text>

  <text x="550" y="690" class="t" font-size="13" font-weight="700" fill="#0f172a">Запомнить: «динамический — мягкая характеристика; объёмный — жёсткая подача»</text>
  <text x="550" y="720" class="t" font-size="12" fill="#64748b">Источники идей: Моргунов, Ухин, Кузнецов/Никифоров, методички УГНТУ (парафраз)</text>
  <text x="550" y="745" class="t" font-size="11" fill="#94a3b8">Распечатать: Ctrl+P · альбомная ориентация · масштаб «вписать в лист»</text>
</svg>
