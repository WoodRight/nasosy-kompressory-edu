<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=./index.html" />
  <script>
    var en = false; try { en = localStorage.getItem('nk-lang') === 'en'; } catch (e) {}
    if (en) { document.documentElement.lang = 'en'; document.title = 'Redirecting…'; }
    location.replace('./index.html' + (location.hash || '#/'));
  </script>
  <title>Перенаправление…</title>
</head>
<body>
  <p><a href="./index.html" id="home">Перейти на главную</a> · <a href="./index.html" lang="en">Go to home page</a></p>
</body>
</html>
